}

.btn {

select {

.monthly {

.monthly strong {

/* 🚗 ANIMASI KERETA PREMIUM */

.car-animation {
  position: relative;
  width: 90px;
  height: 52px;

  overflow: hidden;
}

/* 🛣️ Jalan */
.car-animation::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  height: 5px;
  background: #555;
  border-radius: 10px;
  box-shadow:
    15px 0 0 -1px #888,
    35px 0 0 -1px #888,
    55px 0 0 -1px #888,
    75px 0 0 -1px #888;
}

/* 🚗 Kereta */
.car-animation {
  position: relative;
  width: 90px;
  height: 52px;
  margin: 0 auto 3px auto;
  overflow: hidden;
}

.car-animation::after {
  content: "";
  position: absolute;
  left: 3px;
  right: 3px;
  bottom: 3px;
  height: 5px;
  background: #777;
  border-radius: 10px;
}

/* Kereta */
.car-animation .table-car-image {
  position: absolute;
  z-index: 2;
  width: 75px !important;
  height: 45px !important;
  object-fit: contain !important;
  left: 0;
  top: 0;
  margin: 0 !important;
}

/* Animasi wrapper */
.car-animation {
  animation: keretaJalan 3s ease-in-out infinite;
  will-change: transform;
}

@keyframes keretaJalan {
  0% {
    transform: translateX(-5px);
  }

  50% {
    transform: translateX(5px);
  }

  100% {
    transform: translateX(-5px);
  }
}

  0% {

  50% {

  100% {
    background-position: 0% 50%;
  }
}

  content: "";
  position: fixed;
  width: 280px;
  height: 280px;

  background: rgba(0, 200, 255, 0.18);
  filter: blur(80px);
  border-radius: 50%;

  top: 10%;
  left: -100px;

  animation: neonMove 8s ease-in-out infinite alternate;

  pointer-events: none;
  z-index: -1;
}

@keyframes neonMove {
  0% {

  100% {
    transform: translate(900px, -50px);
  }
}

<script>
